# Redis configuration for docker-asterisk
# Minimal config including keyspace notifications required for expired event handling

bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# By default Redis persistence is disabled in this minimal file. Enable if needed.
save 900 1
save 300 10
save 60 10000

appendonly no

# Keyspace notifications: enable expired events (E) and evicted events (x)
# 'Ex' = Keyevent events for expired keys. This allows subscribing to
# __keyevent@<db>__:expired. Adjust as needed.
notify-keyspace-events Ex

# Logging
loglevel notice
logfile ""

# Maxmemory policy (change according to your needs)
maxmemory 0
maxmemory-policy noeviction

