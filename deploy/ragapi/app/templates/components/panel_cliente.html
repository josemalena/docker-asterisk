{# Componente: Datos Cliente / Perfil (FASE 10). Lo rellena conversacion.js. #}
<div class="panel panel-cliente">
  <div class="panel-head"><i class="bi bi-person-badge me-1"></i>Datos Cliente</div>
  <div class="panel-body perfil-body">
    <dl class="perfil">
      <dt>Nombre</dt><dd id="perfil-nombre">N/D</dd>
      <dt>Código Persona</dt><dd id="perfil-cod">N/D</dd>
      <dt>Teléfono</dt><dd id="perfil-tel">N/D</dd>
      <dt>Canal</dt><dd id="perfil-canal">N/D</dd>
      <dt>Estado Validación</dt>
      <dd><span class="badge estado-validacion" id="perfil-estado" data-estado="sin_validar">Sin validar</span></dd>
    </dl>
  </div>
</div>
