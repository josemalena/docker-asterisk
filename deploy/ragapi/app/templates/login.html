<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso · Real[IA]</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
  <div class="login-wrap">
    <form method="POST" class="login-card">
      <h1 class="h5 mb-1"><i class="bi bi-shield-lock me-1"></i>Real[IA] · Administración</h1>
      <p class="sub text-muted small mb-3">Ingresa para ver las interacciones del chatbot.</p>
      {% with messages = get_flashed_messages() %}
        {% for message in messages %}
          <div class="alert alert-danger py-2 px-3 small mb-3" role="alert">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      <label class="form-label small text-muted mb-1">Usuario</label>
      <input type="text" name="usuario" class="form-control mb-2" required autofocus autocomplete="username">
      <label class="form-label small text-muted mb-1">Contraseña</label>
      <input type="password" name="password" class="form-control" required autocomplete="current-password">
      <button class="btn btn-primary w-100 mt-3" type="submit">Ingresar</button>
    </form>
  </div>
</body>
</html>
