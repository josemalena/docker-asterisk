;-------------------------------- PrivateDial ----------------------------------
; Filename: pjsip_transport.conf
; This file is an Asterisk configuration file, part of the PrivateDial suite
; It is included by the pjsip.conf file.
;

;-------------------------------- transports -----------------------------------


[t_wan](!)
type = transport
bind = 0.0.0.0:5060
domain = 172.17.110.58
local_net=10.66.20.0/24  ; via LAN
local_net=192.162.2.0/24 ; via iMac
external_signaling_address = 172.17.110.58
external_media_address = 172.17.110.58
tos = cs3
cos = 3

[udp](t_wan)
protocol = udp
endpoint/rewrite_contact = yes
endpoint/direct_media = no
endpoint/rtp_symmetric = yes
endpoint/bind_rtp_to_media_address = yes

[tcp](t_wan)
protocol = tcp

[tls](t_wan)
bind = 0.0.0.0:5061
cert_file = /etc/ssl/asterisk/cert.pem
priv_key_file = /etc/ssl/asterisk/priv_key.pem
protocol = tls
method=tlsv1_2
